[package]
name = "beacon-desktop"
version = "0.1.0-p3b.1"
description = "Beacon local-only read-only Desktop/browser host"
authors = ["Beacon contributors"]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", default-features = false, features = ["wry"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
